version: '3.8'

# Simple deployment - Direct Node.js (no web server)
# Best for: Development, internal services

services:
  kora-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: kora-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ALLOWED_ORIGINS=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3


